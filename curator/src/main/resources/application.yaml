spring:
  application:
    name: curator

  config:
    import: "optional:file:./.env[.properties]"

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/curator}
    username: ${DB_USERNAME:curator}
    password: ${DB_PASSWORD:curator}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  ai:
    model:
      chat: google-genai
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-2.5-flash}

app:
  jwt:
    secret: ${JWT_SECRET}
  oauth:
    kakao:
      user-info-uri: https://kapi.kakao.com/v2/user/me
    naver:
      user-info-uri: https://openapi.naver.com/v1/nid/me
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      issuer: https://accounts.google.com
      jwks-uri: https://www.googleapis.com/oauth2/v3/certs
